name: tishikgasha

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: tishk
      POSTGRES_PASSWORD: tishk_dev_pw
      POSTGRES_DB: tishikgasha
    volumes:
      - tishk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tishk -d tishikgasha"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: node:22
    working_dir: /app/server
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tishk:tishk_dev_pw@db:5432/tishikgasha
      PORT: "8000"
      APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      API_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - path: /run/base44/app.env
        required: false
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec node --watch index.js"]
    volumes:
      - ./server:/app/server
      - server_node_modules:/app/server/node_modules
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  web:
    image: node:22
    working_dir: /app/web
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_API_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${BASE44_SANDBOX_HOST_DOMAIN}
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    volumes:
      - .:/app/web
      - web_node_modules:/app/web/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s

volumes:
  tishk_pgdata:
  server_node_modules:
  web_node_modules:
